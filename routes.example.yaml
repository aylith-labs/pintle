# Copy to routes.yaml and customize for your setup:
#   cp routes.example.yaml routes.yaml
#
# Target formats:
#   port-only (5174)            — resolves to localhost or host.docker.internal automatically
#   full URL                    — http://192.168.1.50:3000, used as-is
#   http://host.docker.internal:PORT — Windows-side service in WSL setups (rewritten to WSL→Windows gateway)
#   http://host.wsl.internal:PORT    — WSL2 Linux-side service (resolved via /etc/hosts, no rewrite)

passthrough: []
  # - domain: example-local.com
  #   target: traefik

routes: []
  # - host: app.lvh.me
  #   target: 5174
  # - host: api.lvh.me
  #   target: http://192.168.1.50:3000
  #   path: /api
  #   strip: true
  #
  # One service under several names is ONE route. `hosts` is unioned with `host`, so a
  # cert per base domain (certs/<domain>.pem) is all that is needed to serve them all:
  # - host: app.lvh.me
  #   hosts:
  #     - app.localtest.me
  #     - app.localhost
  #   target: 5174

tcp: []
  # - host: db.lvh.me
  #   target: 5432
  #   listen: 5432

# Explicit replica pool (choose target OR targets for a route):
# - host: app.lvh.me
#   path: /api
#   strip: true
#   targets: [8000, 8001]

# Optional read-only readiness checks for an explicit static targets pool:
# - host: app.lvh.me
#   targets: [8000, 8001]
#   health:
#     path: /ready
#     interval_seconds: 10
#     timeout_seconds: 2
